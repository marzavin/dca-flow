name: Application Release as Docker Image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Get version"
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build DCA Flow Image
        run: docker build . --file Dockerfile --tag marzavin/dcaflow:${{ env.RELEASE_VERSION }}

      - name: Tag DCA Flow Image as 'latest'
        run: docker tag marzavin/dcaflow:${{ env.RELEASE_VERSION }} marzavin/dcaflow:latest

      - name: Docker Login
        run: docker login -u="${{ secrets.DOCKER_LOGIN }}" -p="${{ secrets.DOCKER_PASSWORD }}"

      - name: Push DCA Flow Image (version tag)
        run: docker image push marzavin/dcaflow:${{ env.RELEASE_VERSION }}

      - name: Push DCA Flow Image (latest)
        run: docker image push marzavin/dcaflow:latest
